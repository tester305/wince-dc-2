# .github/workflows/build.yml
name: Build Windows CE Dreamcast

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: \( {{ github.workflow }}- \){{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build GDI + Modules
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------
      # Toolchain setup
      # --------------------------------------------------
      - name: Install Ninja
        run: choco install ninja -y --no-progress
        shell: pwsh

      - name: Verify tools
        shell: pwsh
        run: |
          cmake --version
          ninja --version
          Write-Host "PowerShell version: $($PSVersionTable.PSVersion)"

      # --------------------------------------------------
      # Configure
      # --------------------------------------------------
      - name: Configure CMake (retail)
        shell: pwsh
        run: |
          cmake -G Ninja `
                -S . `
                -B build `
                -DKERNEL=retail `
                -DDLLS=retail `
                -DCMAKE_BUILD_TYPE=Release

      # --------------------------------------------------
      # Build stages
      # --------------------------------------------------
      - name: Build SH-4 modules
        shell: pwsh
        run: |
          Write-Host "=== Building modules ==="
          cmake --build build --target all -j

      - name: Build OS image
        shell: pwsh
        run: |
          Write-Host "=== Building 0winceos.bin ==="
          cmake --build build --target image -j

      - name: Build GDI disc
        shell: pwsh
        run: |
          Write-Host "=== Building disc.gdi ==="
          cmake --build build --target gdi -j

      # --------------------------------------------------
      # Collect & package
      # --------------------------------------------------
      - name: Collect artifacts
        id: collect
        shell: pwsh
        run: |
          $dist = "dist"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          # Main disc files
          if (Test-Path "build/disc") {
            Copy-Item "build/disc/*" "$dist/" -Recurse -Force
          }

          # Raw OS image
          if (Test-Path "build/0winceos.bin") {
            Copy-Item "build/0winceos.bin" "$dist/"
          }

          # Compiled modules
          if (Test-Path "build/modules") {
            Copy-Item "build/modules" "$dist/modules" -Recurse -Force
          }

          # Create convenient zip for GDEMU users
          if (Test-Path "build/disc") {
            Compress-Archive -Path "build/disc/*" `
                             -DestinationPath "$dist/wince-dc-disc.zip" `
                             -Force
          }

          # List everything
          Get-ChildItem $dist -Recurse | Format-Table Name, Length -AutoSize

      # --------------------------------------------------
      # Summary
      # --------------------------------------------------
      - name: Write job summary
        shell: pwsh
        run: |
          @"
          ### Windows CE Dreamcast Build Results

          | File | Description |
          |------|-------------|
          | ``disc.gdi`` + tracks | Bootable Dreamcast image (GDEMU / MODE / USB-GD-ROM) |
          | ``wince-dc-disc.zip`` | Ready-to-copy package |
          | ``0winceos.bin`` | Raw CE OS image |
          | ``modules/`` | Compiled DLLs & EXEs (dcshell, Explorer, etc.) |

          **How to use**
          1. Download the artifact
          2. Extract ``wince-dc-disc.zip``
          3. Copy the contents to your GDEMU / MODE SD card
          4. Boot and enjoy the DCWin desktop
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      # --------------------------------------------------
      # Upload
      # --------------------------------------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wince-dc-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
